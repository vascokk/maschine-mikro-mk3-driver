# Pad note mappings (MIDI note numbers for the 16 pads)
notemaps = [49, 27, 31, 57, 48, 47, 43, 59, 36, 38, 46, 51, 36, 38, 42, 44]

# MIDI client and port names
client_name = "Maschine Mikro MK3"
port_name = "Maschine Mikro MK3 MIDI Out"

# Transport button MIDI channel (valid range: 0-15, default: 0)
# This determines which MIDI channel transport buttons send messages on
transport_channel = 0

# Transport button CC mappings (valid range: 0-127)
# These CC numbers are sent when transport buttons are pressed/released
# Button press sends value 127, button release sends value 0
[transport_cc_map]
play = 118
stop = 117
rec = 119
restart = 116
erase = 120
tap = 121
follow = 122

# Button MIDI channel (valid range: 0-15, default: 0)
# This determines which MIDI channel all non-transport buttons send messages on
button_channel = 0

# Button CC mappings (valid range: 0-127)
# These CC numbers are sent when buttons are pressed/released
# Button press sends value 127, button release sends value 0
[button_cc_map]
# Navigation buttons
left = 20
right = 21

# Main control buttons
maschine = 22
star = 23
browse = 24
volume = 25

# Performance control buttons
swing = 26
tempo = 27
plugin = 28
sampling = 29

# Pitch and modulation buttons
pitch = 30
mod_button = 31

# Mode selection buttons
perform = 32
notes = 33
group = 34
auto = 35

# Recording control buttons
lock = 36
note_repeat = 37

# Modifier buttons
shift = 38
fixed_vol = 39

# Pad mode buttons
pad_mode = 40
keyboard = 41
chords = 42
step = 43

# Sequencer control buttons
scene = 44
pattern = 45
events = 46
variation = 47
duplicate = 48

# Track control buttons
select = 49
solo = 50
mute = 51

# Encoder MIDI channel (valid range: 0-15, default: 0)
# This determines which MIDI channel the encoder sends messages on
encoder_channel = 0

# Encoder CC mappings (valid range: 0-127)
# rotation: CC sent when encoder is rotated (relative values)
# press: CC sent when encoder is pressed (127) or released (0)
# touch: CC sent when encoder is touched (127) or released (0)
[encoder_cc_map]
rotation = 10
press = 52
touch = 53

# Touch strip MIDI channel (valid range: 0-15, default: 0)
# This determines which MIDI channel the touch strip sends messages on
touch_strip_channel = 0

# Touch strip CC number (valid range: 0-127, default: 1)
# CC 1 is the standard modulation wheel control
# The strip sends absolute position values (0-127)
touch_strip_cc = 1

# Button modes configuration
# Configure which buttons use toggle mode (latching) vs momentary mode (default)
# Toggle mode: Button alternates between on (127) and off (0) with each press
# Momentary mode: Button sends 127 on press, 0 on release
# Only list buttons you want to set to toggle mode (all others default to momentary)
#
# Valid button names (case-insensitive):
#   Navigation: left, right
#   Main Control: maschine, star, browse, volume
#   Performance: swing, tempo, plugin, sampling
#   Pitch/Mod: pitch, mod_button
#   Mode Selection: perform, notes, group, auto
#   Recording: lock, note_repeat
#   Modifiers: shift, fixed_vol
#   Pad Modes: pad_mode, keyboard, chords, step
#   Sequencer: scene, pattern, events, variation, duplicate
#   Track Control: select, solo, mute
#   Transport: play, stop, rec, restart, erase, tap, follow
#   Encoder: encoder_press, encoder_touch
#
[button_modes]
# Example: Configure mute, solo, and rec as toggle buttons
# Uncomment and customize as needed:
# toggle_buttons = { "mute" = true, "solo" = true, "rec" = true }

# Shift button combinations
# When Shift is held and another button is pressed, a different CC number is sent
# This effectively doubles your available button mappings (40 single + 40 Shift combinations)
# Default CC numbers: 54-93 (sequential allocation)
# Only specify values if you want to override the defaults
#
# Note: Shift+Shift sends the regular Shift CC (not a combination)
# Note: Toggle mode applies independently to single presses and Shift combinations
#
[shift_combinations]
# Navigation (2 buttons)
left = 54
right = 55

